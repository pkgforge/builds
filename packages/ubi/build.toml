[pkg]
name        = "ubi"
description = "The universal binary installer"
homepage    = ["https://github.com/houseabsolute/ubi"]
license     = ["MIT OR Apache-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]

reason = "upstream ships riscv64 as gnu-linked only; soar needs static musl"

[source]
git     = "https://github.com/houseabsolute/ubi"
commit  = "9b402353524f4db7155c70f9d0e785e9ed692a41"
version = "0.12.0"

[build]
image = "ghcr.io/rust-cross/cargo-zigbuild@sha256:b8364c2c60cdcc9b95c402d17654bff517410926a35678bd89dd924b8158d6ae"
hosts = ["riscv64-linux"]

[build.target]
riscv64-linux = "riscv64gc-unknown-linux-musl"

[build.env]
RUSTUP_TOOLCHAIN = "stable"
RUSTFLAGS = "-C target-feature=+crt-static"

[build.script]
run = """
CARGO_HOME=/usr/local/cargo rustup toolchain install "$RUSTUP_TOOLCHAIN" \
  --profile minimal --no-self-update --target "$TARGET"
cargo zigbuild --release --locked --target "$TARGET"
"""

[verify]
run = ["--version"]

[artifact]
"target/${target}/release/ubi" = "ubi"
"LICENSE-APACHE"               = "LICENSE-APACHE"
"LICENSE-MIT"                  = "LICENSE-MIT"
