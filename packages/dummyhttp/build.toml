[pkg]
name        = "dummyhttp"
description = "Super simple HTTP server that replies a fixed body with a fixed response code"
homepage    = ["https://github.com/svenstaro/dummyhttp"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]

reason = "upstream ships riscv64 as gnu-linked only; soar needs static musl"

[source]
git     = "https://github.com/svenstaro/dummyhttp"
commit  = "08efe1ee9ddea6d08955b7e9f7b198bcb1e4e622"
version = "1.1.3"

[build]
image = "ghcr.io/rust-cross/cargo-zigbuild@sha256:b8364c2c60cdcc9b95c402d17654bff517410926a35678bd89dd924b8158d6ae"
hosts = ["riscv64-linux"]

[build.target]
riscv64-linux = "riscv64gc-unknown-linux-musl"

[build.env]
RUSTUP_TOOLCHAIN = "1.95.0"
RUSTFLAGS = "-C target-feature=+crt-static"

[build.script]
run = """
CARGO_HOME=/usr/local/cargo rustup toolchain install "$RUSTUP_TOOLCHAIN" \
  --profile minimal --no-self-update --target "$TARGET"
cargo zigbuild --release --locked --target "$TARGET"
"""

[verify]
run = ["--version"]

[artifact]
"target/${target}/release/dummyhttp" = "dummyhttp"
"LICENSE"                            = "LICENSE"
