[pkg]
name        = "nushell"
description = "A new type of shell"
homepage    = ["https://github.com/nushell/nushell"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]

reason = "upstream ships riscv64 as gnu-linked only; soar needs static musl"

[source]
git     = "https://github.com/nushell/nushell"
commit  = "798c55d19505fd52f205d7eb32a571b9d06ec9e6"
version = "0.115.1"

[build]
image = "ghcr.io/rust-cross/cargo-zigbuild@sha256:b8364c2c60cdcc9b95c402d17654bff517410926a35678bd89dd924b8158d6ae"
hosts = ["riscv64-linux"]

[build.target]
riscv64-linux = "riscv64gc-unknown-linux-musl"

[build.env]
RUSTUP_TOOLCHAIN = "1.95.0"
RUSTFLAGS = "-C target-feature=+crt-static"

[build.script]
run = """
CARGO_HOME=/usr/local/cargo rustup toolchain install "$RUSTUP_TOOLCHAIN" \
  --profile minimal --no-self-update --target "$TARGET"
cargo zigbuild --release --locked --target "$TARGET"
"""

[verify]
run = ["--version"]

[artifact]
"target/${target}/release/nu" = "nu"
"LICENSE"                     = "LICENSE"
