[pkg]
name        = "ruff"
description = "Extremely fast Python linter and code formatter, written in Rust"
homepage    = ["https://github.com/astral-sh/ruff"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]

reason = "upstream ships riscv64 as gnu-linked only; soar needs static musl"

[source]
git     = "https://github.com/astral-sh/ruff"
commit  = "11c76bf48fdac06b2f240cba502eda96da4dce77"
version = "0.16.4"

[build]
image = "ghcr.io/rust-cross/cargo-zigbuild@sha256:b8364c2c60cdcc9b95c402d17654bff517410926a35678bd89dd924b8158d6ae"
hosts = ["riscv64-linux"]

[build.target]
riscv64-linux = "riscv64gc-unknown-linux-musl"

[build.env]
RUSTUP_TOOLCHAIN = "1.95.0"
RUSTFLAGS = "-C target-feature=+crt-static"

[build.script]
run = """
CARGO_HOME=/usr/local/cargo rustup toolchain install "$RUSTUP_TOOLCHAIN" \
  --profile minimal --no-self-update --target "$TARGET"
cargo zigbuild --release --locked -p ruff --target "$TARGET"
"""

[verify]
run = ["--version"]

[artifact]
"target/${target}/release/ruff" = "ruff"
"LICENSE"                       = "LICENSE"
