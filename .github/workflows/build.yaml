name: Build

on:
  push:
    paths: ['packages/**', 'build.py']
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to build; empty builds all'
        type: string
        default: ''
      publish:
        description: 'Publish a release'
        type: boolean
        default: false
      force:
        description: 'Rebuild even if the version is already published'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, glob, os, subprocess, sys, tomllib
          only = os.environ.get("ONLY", "").strip()
          force = os.environ.get("FORCE", "").lower() == "true"
          jobs = []
          for path in sorted(glob.glob("packages/*/build.toml")):
              name = path.split("/")[1]
              if only and name != only:
                  continue
              cfg = tomllib.load(open(path, "rb"))
              # A published version is already built and pinned downstream, so
              # rebuilding it produces bytes nobody will use. Skipping keeps the
              # matrix proportional to what actually changed.
              tag = f"{name}-{cfg['source']['version']}"
              if not force and subprocess.run(
                      ["gh", "release", "view", tag],
                      capture_output=True).returncode == 0:
                  print(f"::notice::{tag} already published, skipping", file=sys.stderr)
                  continue
              for host in cfg["build"]["hosts"]:
                  jobs.append({"package": name, "host": host,
                               "runner": "ubuntu-24.04-arm" if host.startswith("aarch64")
                                         else "ubuntu-latest"})
          print("jobs=" + json.dumps(jobs))
          EOF
        env:
          ONLY: ${{ inputs.package }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}

  build:
    needs: matrix
    if: needs.matrix.outputs.jobs != '[]'
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.matrix.outputs.jobs) }}
    runs-on: ${{ matrix.job.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Build
        id: build
        run: python3 build.py "${{ matrix.job.package }}" --host "${{ matrix.job.host }}" --runtime docker

      # A version is published once. Rebuilding an existing tag would either
      # be a no-op or quietly replace bytes somebody has already pinned, so
      # the tag's absence is what marks a build as new.
      - name: Decide whether to publish
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg="${{ matrix.job.package }}"
          ver=$(python3 -c "import tomllib;print(tomllib.load(open('packages/$pkg/build.toml','rb'))['source']['version'])")
          tag="${pkg}-${ver}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already published, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Publishing is confined to main. A push to an update PR branch still
      # builds, but a release is cut only once the bump has been reviewed and
      # merged. Manual dispatch overrides.
      - name: Attest provenance
        if: (steps.gate.outputs.publish == 'true' && github.ref == 'refs/heads/main') || inputs.publish
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz

      - name: Publish
        if: (steps.gate.outputs.publish == 'true' && github.ref == 'refs/heads/main') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.gate.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --notes "Built from a pinned source, toolchain and target."
          gh release upload "$tag" dist/*.tar.gz --clobber

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.job.package }} (${{ matrix.job.host }})"
            echo
            echo '```'
            sha256sum dist/*.tar.gz
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
